<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="main-container" class="container">
        <div id="display"></div>
        <div class="buttons container">
            <div class="keypad container">
                <div class="btn-row">
                    <button id="seven-7" class="number">7</button>
                    <button id="eight-8" class="number">8</button>
                    <button id="nine-9" class="number">9</button>
                    <button id="addition" class="operator">+</button>
                </div>
                <div class="btn-row">
                    <button id="four-4" class="number">4</button>
                    <button id="five-5" class="number">5</button>
                    <button id="six-6" class="number">6</button>
                    <button id="subtraction" class="operator">-</button>
                </div>
                <div class="btn-row">
                    <button id="one-1" class="number">1</button>
                    <button id="two-2" class="number">2</button>
                    <button id="three-3" class="number">3</button>
                    <button id="multiplication" class="operator">×</button>
                </div>
                <div class="btn-row">
                    <button id="zero-0" class="number">0</button>
                    <button id="clear">AC</button>
                    <button id="equals">=</button>
                    <button id="division" class="operator">÷</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
